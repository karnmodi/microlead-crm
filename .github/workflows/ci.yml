name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm exec turbo run build

      - name: Prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_validate
        run: pnpm --filter @microlead-crm/api exec prisma validate
